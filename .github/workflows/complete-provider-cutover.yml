name: Complete provider cutover

on:
  push:
    branches:
      - refactor/remove-emergent

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Replace Emergent backend integration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("backend/server.py")
          text = path.read_text(encoding="utf-8")

          text, n = re.subn(
              r'^from emergentintegrations\.llm\.chat import LlmChat, UserMessage\r?\n',
              'from llm_provider import LlmChat, UserMessage\n',
              text,
              flags=re.MULTILINE,
          )
          text, n2 = re.subn(
              r'^from emergentintegrations\.payments\.stripe\.checkout import StripeCheckout, CheckoutSessionRequest\r?\n',
              'from stripe_provider import StripeCheckout, CheckoutSessionRequest\n',
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(r'^EMERGENT_LLM_KEY\s*=.*\r?\n', '', text, flags=re.MULTILINE)
          text = text.replace('api_key=EMERGENT_LLM_KEY,', 'api_key=None,')

          if n != 1 or n2 != 1:
              raise SystemExit(f"Expected one replacement per Emergent import; got llm={n}, stripe={n2}")
          if "emergentintegrations" in text or "EMERGENT_LLM_KEY" in text:
              raise SystemExit("Emergent backend references remain after migration")

          path.write_text(text, encoding="utf-8")

      - name: Verify backend imports
        run: |
          python -m py_compile backend/server.py backend/llm_provider.py backend/stripe_provider.py
          ! grep -RniE 'emergentintegrations|EMERGENT_LLM_KEY' backend --exclude-dir='__pycache__'

      - name: Run provider tests
        working-directory: backend
        run: |
          python -m pytest tests/unit/test_provider_adapters.py -q

      - name: Remove temporary workflow
        run: rm -f .github/workflows/complete-provider-cutover.yml

      - name: Commit provider cutover
        run: |
          git config user.name "Auto-AI Recovery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py .github/workflows/complete-provider-cutover.yml
          git commit -m "refactor: cut backend over from Emergent providers" || exit 0
          git push
