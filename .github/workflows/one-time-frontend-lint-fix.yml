name: One-time frontend lint fix

on:
  push:
    branches:
      - fix/production-image-prewarm

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix frontend production lint errors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("frontend/src")

          path = root / "components/ChatDrawer.jsx"
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { X, Send, Sparkles, Trash2, ChevronDown, Cpu, Zap, Brain, Mic } from "lucide-react";',
              'import { X, Send, Sparkles, Trash2, ChevronDown, Cpu, Zap } from "lucide-react";'
          )
          text = text.replace('import { useI18n, LANGUAGES } from "../lib/i18n";', 'import { useI18n } from "../lib/i18n";')
          text = text.replace('import { SpeakButton, getVoicePref, setVoicePref } from "../lib/tts";\n', '')
          text = re.sub(r'\n  // Voice picker \(ElevenLabs TTS\)\n  const \[voice, setVoice\] = useState\(\(\) => getVoicePref\(\)\);\n  const changeVoice = \(v\) => \{ setVoice\(v\); setVoicePref\(v\); \};\n', '\n', text)
          path.write_text(text, encoding="utf-8")

          path = root / "components/Footer.jsx"
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'\n          <div className="flex items-center gap-2 mt-5">\n            \{\[Instagram, Twitter, Youtube\]\.map\(\(Icon, i\) => \(.*?\n          </div>',
              '',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('import { Zap, Instagram, Twitter, Youtube } from "lucide-react";', 'import { Zap } from "lucide-react";')
          path.write_text(text, encoding="utf-8")

          path = root / "components/InstallPWA.jsx"
          text = path.read_text(encoding="utf-8")
          text = text.replace('>/// install the app</div>', '>{"/// install the app"}</div>')
          path.write_text(text, encoding="utf-8")

          path = root / "pages/Admin.jsx"
          text = path.read_text(encoding="utf-8")
          text = text.replace('  const isRejected = dealer.status === "rejected";\n', '')
          path.write_text(text, encoding="utf-8")

          path = root / "pages/BookCar.jsx"
          text = path.read_text(encoding="utf-8")
          text = text.replace('  const { t } = useI18n();\n', '')
          path.write_text(text, encoding="utf-8")

          # Literal slash separators inside JSX children trigger
          # react/jsx-no-comment-textnodes under CI. Preserve the visual text
          # while expressing it as a JSX expression.
          for path in root.rglob("*.jsx"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'>([ \t\r\n]*)///([^<\r\n]*)([ \t\r\n]*)<',
                  lambda m: '>{' + repr((m.group(1) + '///' + m.group(2) + m.group(3))) + '}',
                  text,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src .github/workflows/one-time-frontend-lint-fix.yml
          git rm .github/workflows/one-time-frontend-lint-fix.yml
          git commit -m "fix: resolve frontend production lint errors"
          git push origin HEAD:fix/production-image-prewarm
