name: Codex Razorpay Recovery Integration

on:
  push:
    branches:
      - codex/integrate-razorpay-recovery

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch verified Razorpay source commit
        run: |
          git fetch origin integration/razorpay-recovery-merge:refs/remotes/origin/integration/razorpay-recovery-merge
          git cat-file -e 75613db9d4cb65684890c0705adfd223583e0316^{commit}

      - name: Integrate Razorpay without merging damaged main
        shell: bash
        run: |
          set -euo pipefail

          git show 75613db9d4cb65684890c0705adfd223583e0316:backend/server.py > /tmp/razorpay_server.py
          git show 75613db9d4cb65684890c0705adfd223583e0316:backend/razorpay_gateway.py > backend/razorpay_gateway.py
          git show 75613db9d4cb65684890c0705adfd223583e0316:backend/tests/test_razorpay_gateway.py > backend/tests/test_razorpay_gateway.py
          git show 75613db9d4cb65684890c0705adfd223583e0316:docs/RAZORPAY.md > docs/RAZORPAY.md
          git show 75613db9d4cb65684890c0705adfd223583e0316:frontend/src/pages/Premium.jsx > frontend/src/pages/Premium.jsx

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          server_path = Path("backend/server.py")
          server = server_path.read_text()
          razorpay_server = Path("/tmp/razorpay_server.py").read_text()

          # Safety gates: this must be the complete independent-recovery server,
          # not the truncated main/server.py from commit 02ce326e.
          required_recovery_markers = [
              "from llm_provider import LlmChat, UserMessage",
              "_IMAGE_CACHE: dict = {}",
              "async def _prewarm_images():",
              "async def find_car_by_name(name: str)",
          ]
          for marker in required_recovery_markers:
              if marker not in server:
                  raise SystemExit(f"Recovery safety gate failed: missing {marker}")

          # Replace only the Stripe import. Preserve the recovery branch's
          # provider-neutral LLM adapter and every unrelated server section.
          old_import = "from stripe_provider import StripeCheckout, CheckoutSessionRequest"
          new_import = '''from razorpay_gateway import (\n    RAZORPAY_KEY_ID,\n    create_order as razorpay_create_order,\n    fetch_payment as razorpay_fetch_payment,\n    is_configured as razorpay_is_configured,\n    verify_payment_signature as razorpay_verify_payment_signature,\n)'''
          if server.count(old_import) != 1:
              raise SystemExit("Expected exactly one Stripe provider import in recovery server")
          server = server.replace(old_import, new_import, 1)

          # Take only the verified Razorpay payment section from the known-good
          # Razorpay commit and transplant it into the recovery server.
          start_marker = "# ---------- Razorpay one-time payments ----------"
          end_marker = "def _assign_partners_to_booking(booking: Booking, car: dict):"
          razor_start = razorpay_server.find(start_marker)
          razor_end = razorpay_server.find(end_marker, razor_start)
          if razor_start < 0 or razor_end < 0:
              raise SystemExit("Could not isolate verified Razorpay payment block")
          razor_block = razorpay_server[razor_start:razor_end]

          stripe_start_marker = "# ---------- Stripe subscriptions ----------"
          stripe_start = server.find(stripe_start_marker)
          stripe_end = server.find(end_marker, stripe_start)
          if stripe_start < 0 or stripe_end < 0:
              raise SystemExit("Could not isolate Stripe payment block in recovery server")
          server = server[:stripe_start] + razor_block + server[stripe_end:]
          server_path.write_text(server)

          # Remove the obsolete Stripe adapter and its Stripe-only unit tests.
          subprocess.run(["git", "rm", "-f", "backend/stripe_provider.py"], check=True)
          unit_path = Path("backend/tests/unit/test_provider_adapters.py")
          unit = unit_path.read_text()
          unit = unit.replace("import hashlib\nimport hmac\nimport time\n\n", "")
          unit = unit.replace("from stripe_provider import verify_webhook_signature\n", "")
          unit = re.sub(r"\n\ndef test_stripe_webhook_signature_is_verified\(\):.*?\n(?=\ndef |\Z)", "", unit, flags=re.S)
          unit = re.sub(r"\n\ndef test_stripe_webhook_signature_rejects_wrong_payload\(\):.*?\n(?=\ndef |\Z)", "", unit, flags=re.S)
          unit = re.sub(r"\n\ndef test_stripe_webhook_signature_rejects_expired_timestamp\(\):.*?\n(?=\ndef |\Z)", "", unit, flags=re.S)
          unit_path.write_text(unit.rstrip() + "\n")

          # No Stripe/Emergent runtime references may survive in active code.
          active = []
          for root in (Path("backend"), Path("frontend/src")):
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix in {".py", ".js", ".jsx", ".ts", ".tsx"}:
                      text = p.read_text(errors="ignore").lower()
                      if "stripe" in text or "emergentintegrations" in text or "emergent" in text:
                          active.append(str(p))
          if active:
              raise SystemExit("Forbidden active Stripe/Emergent references remain: " + ", ".join(active))

          # The recovery server must retain the image cache definition that
          # previously caused Render's NameError.
          if server.count("_IMAGE_CACHE: dict = {}") != 1:
              raise SystemExit("Image cache safety gate failed")

          # Razorpay endpoints must be unique and the old Stripe endpoints gone.
          for marker in [
              '@api_router.post("/checkout/order")',
              '@api_router.post("/checkout/verify")',
              '@api_router.get("/checkout/status/{order_id}")',
              '@app.post("/api/webhook/razorpay")',
              '@api_router.get("/me/access")',
          ]:
              if server.count(marker) != 1:
                  raise SystemExit(f"Endpoint safety gate failed: {marker}")
          for marker in ["/checkout/session", "/api/webhook/stripe", "/me/subscription"]:
              if marker in server:
                  raise SystemExit(f"Old Stripe endpoint remains: {marker}")
          PY

      - name: Validate backend syntax and tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m py_compile server.py razorpay_gateway.py
          python -m pytest tests/unit/test_provider_adapters.py tests/test_razorpay_gateway.py -q

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Review final diff
        run: |
          git diff --check
          git status --short
          git diff --stat
          echo "--- active Stripe/Emergent scan ---"
          if grep -RniE 'stripe|emergentintegrations|emergent' backend frontend/src --include='*.py' --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then
            echo "Forbidden runtime reference found"
            exit 1
          fi

      - name: Commit verified integration and remove temporary runner
        run: |
          rm -f .github/workflows/codex-razorpay-recovery-integration.yml
          git add -A
          git commit -m "feat: integrate Razorpay into independent recovery branch"
          git push origin HEAD:codex/integrate-razorpay-recovery
