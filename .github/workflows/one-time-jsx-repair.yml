name: One-time JSX repair

on:
  push:
    branches:
      - fix/production-image-prewarm

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed closing tags from lint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("frontend/src")
          changed = []
          for path in root.rglob("*.jsx"):
              text = path.read_text(encoding="utf-8")
              fixed = re.sub(r'}(/(?:[A-Za-z][A-Za-z0-9.-]*))>', r'}<\1>', text)
              if fixed != text:
                  path.write_text(fixed, encoding="utf-8")
                  changed.append(str(path))
          if not changed:
              raise SystemExit("No malformed JSX closing tags found")
          print("Repaired:")
          print("\n".join(changed))
          PY

      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src .github/workflows/one-time-jsx-repair.yml
          git rm .github/workflows/one-time-jsx-repair.yml
          git commit -m "fix: repair JSX closing tags"
          git push origin HEAD:fix/production-image-prewarm
