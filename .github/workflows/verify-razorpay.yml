name: Verify Razorpay migration

on:
  push:
    branches:
      - feat/razorpay-one-time-payments-2

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend Python modules
        run: python -m py_compile backend/server.py backend/razorpay_gateway.py backend/tests/test_razorpay_gateway.py
