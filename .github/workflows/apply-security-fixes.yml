name: Apply security fixes
on:
  push:
    branches:
      - refactor/remove-emergent
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-emergent
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_security_fixes.py
      - name: Validate syntax
        run: python -m py_compile backend/server.py backend/llm_provider.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/llm_provider.py
          git commit -m "security: fix chat ownership and Stripe origin validation"
          git push origin HEAD:refactor/remove-emergent
