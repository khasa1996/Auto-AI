name: Fix default model registry

on:
  push:
    branches:
      - refactor/remove-emergent

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: align default Claude model') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align default Claude model with registry
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/server.py')
          s = p.read_text(encoding='utf-8')
          old = 'CLAUDE_MODEL = ("anthropic", "claude-sonnet-4-5-20250929")'
          new = 'CLAUDE_MODEL = ("anthropic", "claude-sonnet-4-6")'
          if old not in s:
              raise SystemExit('Expected legacy default Claude model was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'Auto-AI Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git commit -m 'fix: align default Claude model'
          git push
