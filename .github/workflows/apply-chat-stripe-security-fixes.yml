name: Apply chat and Stripe security fixes

on:
  push:
    branches:
      - refactor/remove-emergent

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'security: fix chat ownership and Stripe origin validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-emergent
          fetch-depth: 0

      - name: Apply targeted security fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          server_path = Path('backend/server.py')
          text = server_path.read_text()

          old = '''async def get_chat(session_id: str, system_message: str, model_key: Optional[str] = None) -> LlmChat:\n    """Return an LlmChat pinned to the requested model (default: Claude Sonnet)."""\n    m = AI_MODELS.get(model_key) if model_key else None\n    provider_model = (m["provider"], m["model"]) if m else CLAUDE_MODEL\n    chat = LlmChat(\n        api_key=None,\n        session_id=session_id,\n        system_message=system_message,\n    ).with_model(*provider_model)\n    return chat\n'''
          new = '''async def get_chat(\n    session_id: str,\n    system_message: str,\n    model_key: Optional[str] = None,\n    owner_phone: Optional[str] = None,\n) -> LlmChat:\n    """Return an LlmChat pinned to the requested model and caller-owned history."""\n    m = AI_MODELS.get(model_key) if model_key else None\n    provider_model = (m["provider"], m["model"]) if m else CLAUDE_MODEL\n    chat = LlmChat(\n        api_key=None,\n        session_id=session_id,\n        system_message=system_message,\n        owner_phone=owner_phone,\n    ).with_model(*provider_model)\n    return chat\n'''
          if old not in text:
              raise SystemExit('get_chat block not found')
          text = text.replace(old, new, 1)

          old = '''@api_router.post("/ai/chat")\nasync def ai_chat(req: ChatRequest, caller_phone: Optional[str] = Depends(optional_user_phone)):\n    try:\n        await db.chat_messages.insert_one({\n            "id": str(uuid.uuid4()),\n            "session_id": req.session_id,\n            "role": "user",\n            "content": req.message,\n            "ts": datetime.now(timezone.utc).isoformat(),\n        })\n'''
          new = '''@api_router.post("/ai/chat")\nasync def ai_chat(req: ChatRequest, caller_phone: Optional[str] = Depends(optional_user_phone)):\n    try:\n        # Guest chat is intentionally stateless. Authenticated chat is persisted\n        # and bound to the authenticated phone so a session id cannot cross users.\n        if caller_phone:\n            existing = await db.chat_messages.find_one(\n                {"session_id": req.session_id}, {"_id": 0, "owner_phone": 1}\n            )\n            if existing and existing.get("owner_phone") != caller_phone:\n                raise HTTPException(status_code=403, detail="Chat session belongs to another user")\n            await db.chat_messages.insert_one({\n                "id": str(uuid.uuid4()),\n                "session_id": req.session_id,\n                "owner_phone": caller_phone,\n                "role": "user",\n                "content": req.message,\n                "ts": datetime.now(timezone.utc).isoformat(),\n            })\n'''
          if old not in text:
              raise SystemExit('ai_chat user persistence block not found')
          text = text.replace(old, new, 1)

          old = '        chat = await get_chat(req.session_id, system, req.model)\n'
          new = '        chat = await get_chat(req.session_id, system, req.model, caller_phone)\n'
          if old not in text:
              raise SystemExit('ai_chat get_chat call not found')
          text = text.replace(old, new, 1)

          old = '''        await db.chat_messages.insert_one({\n            "id": str(uuid.uuid4()),\n            "session_id": req.session_id,\n            "role": "assistant",\n            "content": response,\n            "model": chosen["label"],\n            "ts": datetime.now(timezone.utc).isoformat(),\n        })\n'''
          new = '''        if caller_phone:\n            await db.chat_messages.insert_one({\n                "id": str(uuid.uuid4()),\n                "session_id": req.session_id,\n                "owner_phone": caller_phone,\n                "role": "assistant",\n                "content": response,\n                "model": chosen["label"],\n                "ts": datetime.now(timezone.utc).isoformat(),\n            })\n'''
          if old not in text:
              raise SystemExit('ai_chat assistant persistence block not found')
          text = text.replace(old, new, 1)

          old = '''@api_router.get("/ai/chat/{session_id}/history")\nasync def chat_history(session_id: str):\n    msgs = await db.chat_messages.find({"session_id": session_id}, {"_id": 0}).sort("ts", 1).to_list(500)\n    return msgs\n'''
          new = '''@api_router.get("/ai/chat/{session_id}/history")\nasync def chat_history(session_id: str, caller_phone: str = Depends(current_user_phone)):\n    msgs = await db.chat_messages.find(\n        {"session_id": session_id, "owner_phone": caller_phone}, {"_id": 0}\n    ).sort("ts", 1).to_list(500)\n    return msgs\n'''
          if old not in text:
              raise SystemExit('chat_history block not found')
          text = text.replace(old, new, 1)

          old = '''    request_origin = http_request.headers.get("origin")\n    if candidate in allowed or (request_origin and candidate == request_origin.rstrip("/")):\n        return candidate\n'''
          new = '''    if candidate in allowed:\n        return candidate\n'''
          if old not in text:
              raise SystemExit('Stripe origin validation block not found')
          text = text.replace(old, new, 1)

          server_path.write_text(text)

          llm_path = Path('backend/llm_provider.py')
          text = llm_path.read_text()

          old = '''class LlmChat:\n    def __init__(self, api_key: Optional[str], session_id: str, system_message: str):\n        self.session_id = session_id\n        self.system_message = system_message\n        self.model_key: Optional[str] = None\n'''
          new = '''class LlmChat:\n    def __init__(\n        self,\n        api_key: Optional[str],\n        session_id: str,\n        system_message: str,\n        owner_phone: Optional[str] = None,\n    ):\n        self.session_id = session_id\n        self.system_message = system_message\n        self.owner_phone = owner_phone\n        self.model_key: Optional[str] = None\n'''
          if old not in text:
              raise SystemExit('LlmChat constructor block not found')
          text = text.replace(old, new, 1)

          old = '''        history: list[dict[str, str]] = []\n        try:\n            server_module = __import__("server")\n            db = getattr(server_module, "db", None)\n            if db is not None:\n                rows = await db.chat_messages.find(\n                    {"session_id": self.session_id}, {"_id": 0, "role": 1, "content": 1}\n                ).sort("ts", 1).to_list(30)\n                history = [\n                    {"role": row["role"], "content": row["content"]}\n                    for row in rows\n                    if row.get("role") in {"user", "assistant"} and row.get("content")\n                ]\n                if history and history[-1]["role"] == "user" and history[-1]["content"] == message.text:\n                    history = history[:-1]\n'''
          new = '''        history: list[dict[str, str]] = []\n        # Only authenticated sessions have persisted history. Guest chat is\n        # stateless, preventing an attacker from replaying a guessed session id.\n        if self.owner_phone:\n            try:\n                server_module = __import__("server")\n                db = getattr(server_module, "db", None)\n                if db is not None:\n                    rows = await db.chat_messages.find(\n                        {"session_id": self.session_id, "owner_phone": self.owner_phone},\n                        {"_id": 0, "role": 1, "content": 1},\n                    ).sort("ts", 1).to_list(30)\n                    history = [\n                        {"role": row["role"], "content": row["content"]}\n                        for row in rows\n                        if row.get("role") in {"user", "assistant"} and row.get("content")\n                    ]\n                    if history and history[-1]["role"] == "user" and history[-1]["content"] == message.text:\n                        history = history[:-1]\n            except Exception:\n                # Chat generation must not fail merely because optional history\n                # loading is unavailable during startup/tests.\n                history = []\n'''
          if old not in text:
              raise SystemExit('LlmChat history block not found')
          text = text.replace(old, new, 1)

          llm_path.write_text(text)

          test_path = Path('backend/tests/unit/test_security_regressions.py')
          test_path.write_text('''import os\nfrom types import SimpleNamespace\n\nimport pytest\n\nos.environ.setdefault("MONGO_URL", "mongodb://localhost:27017")\nos.environ.setdefault("DB_NAME", "autoai_security_tests")\nos.environ.setdefault("SECRET_KEY", "security-test-secret")\nos.environ.setdefault("APP_ENV", "test")\n\nfrom server import _validated_origin\n\n\ndef test_validated_origin_accepts_configured_origin(monkeypatch):\n    monkeypatch.setattr("server.CORS_ORIGINS", ["https://auto-ai.example"])\n    request = SimpleNamespace(base_url="https://api.auto-ai.example/", headers={"origin": "https://attacker.example"})\n    assert _validated_origin("https://auto-ai.example", request) == "https://auto-ai.example"\n\n\ndef test_validated_origin_rejects_attacker_origin_header(monkeypatch):\n    monkeypatch.setattr("server.CORS_ORIGINS", ["https://auto-ai.example"])\n    request = SimpleNamespace(base_url="https://api.auto-ai.example/", headers={"origin": "https://attacker.example"})\n    with pytest.raises(Exception) as exc:  # HTTPException without requiring a live FastAPI app\n        _validated_origin("https://attacker.example", request)\n    assert getattr(exc.value, "status_code", None) == 400\n''')

      - name: Run targeted security tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/unit/test_provider_adapters.py tests/unit/test_security_regressions.py

      - name: Commit fixes back to recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/llm_provider.py backend/tests/unit/test_security_regressions.py
          git diff --cached --quiet && exit 0
          git commit -m "security: fix chat ownership and Stripe origin validation"
          git push origin HEAD:refactor/remove-emergent
