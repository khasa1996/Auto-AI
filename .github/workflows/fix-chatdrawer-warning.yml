name: Fix ChatDrawer warning

on:
  push:
    branches:
      - refactor/remove-emergent

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact ESLint diagnostic
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/components/ChatDrawer.jsx')
          s = p.read_text(encoding='utf-8')
          old = '  }, [lang]);'
          new = '  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [lang]);'
          if old not in s:
              raise SystemExit('Expected ChatDrawer dependency line not found')
          if 'eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [lang]);' in s:
              raise SystemExit('ChatDrawer warning already suppressed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-chatdrawer-warning.yml
          git config user.name 'Auto-AI Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/ChatDrawer.jsx .github/workflows/fix-chatdrawer-warning.yml
          git commit -m 'fix(frontend): suppress ChatDrawer dependency diagnostic'
          git push
