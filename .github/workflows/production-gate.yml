name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: autoai_ci
      ADMIN_PIN: ci-admin-pin
      OTP_DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Wire canonical configurator on integration branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase-2/clean-production-integration' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/server.py")
          text = path.read_text(encoding="utf-8")
          import_marker = "import security\n"
          import_line = "from configurator_routes import make_configurator_router\n"
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit("Cannot find server import marker")
              text = text.replace(import_marker, import_marker + import_line, 1)
          route_marker = "app.include_router(api_router)"
          route_line = "app.include_router(make_configurator_router(db, optional_user_phone))"
          if route_line not in text:
              if route_marker not in text:
                  raise SystemExit("Cannot find canonical api_router mount")
              text = text.replace(route_marker, route_marker + "\n" + route_line, 1)
          index_marker = '    await db.chat_messages.create_index([("session_id", 1), ("owner_phone", 1), ("ts", 1)])'
          index_lines = (
              '    await db.configurations.create_index("config_id", unique=True)\n'
              '    await db.configurations.create_index("share_token", unique=True, sparse=True)'
          )
          if 'await db.configurations.create_index("config_id", unique=True)' not in text:
              if index_marker not in text:
                  raise SystemExit("Cannot find startup index marker")
              text = text.replace(index_marker, index_marker + "\n" + index_lines, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: wire canonical configurator router"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Complete backend test suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      REACT_APP_BACKEND_URL: https://auto-ai-api.onrender.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

  production-smoke:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]

    steps:
      - name: Check live API health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health/live

      - name: Check API readiness
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health/ready
