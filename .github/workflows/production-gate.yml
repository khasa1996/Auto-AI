name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: autoai_ci
      ADMIN_PIN: ci-admin-pin
      OTP_DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Complete backend test suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      REACT_APP_BACKEND_URL: https://auto-ai-api.onrender.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

  production-smoke:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]

    steps:
      - name: Check live API health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health/live

      - name: Check API readiness
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health/ready
