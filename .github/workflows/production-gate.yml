name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  canonical-integrator:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase-2/clean-production-integration' && !contains(github.event.pull_request.head.sha, '000000') && !contains(github.event.pull_request.title, 'canonical integration complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2/clean-production-integration
          fetch-depth: 0

      - name: Apply canonical composition once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.py')
          source = path.read_text()
          import_marker = 'from cars_data import CARS_SEED, NEWS_SEED\nimport security\n'
          import_replacement = 'from cars_data import CARS_SEED, NEWS_SEED\nfrom configurator_composition import mount_configurator_router\nimport security\n'
          if 'from configurator_composition import mount_configurator_router' not in source:
              assert import_marker in source
              source = source.replace(import_marker, import_replacement, 1)
          index_marker = '    await db.chat_messages.create_index([(\"session_id\", 1), (\"owner_phone\", 1), (\"ts\", 1)])\n'
          index_replacement = index_marker + '    await db.configurations.create_index(\"config_id\", unique=True)\n    await db.configurations.create_index(\"share_token\", unique=True, sparse=True)\n'
          if 'await db.configurations.create_index("config_id", unique=True)' not in source:
              assert index_marker in source
              source = source.replace(index_marker, index_replacement, 1)
          router_marker = 'app.include_router(api_router)\n'
          router_replacement = router_marker + 'mount_configurator_router(app, db, optional_user_phone)\n'
          if 'mount_configurator_router(app, db, optional_user_phone)' not in source:
              assert source.count(router_marker) == 1
              source = source.replace(router_marker, router_replacement, 1)
          path.write_text(source)
          PY

      - name: Verify canonical composition
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/server.py').read_text()
          assert source.count('mount_configurator_router(app, db, optional_user_phone)') == 1
          assert 'await db.configurations.create_index("config_id", unique=True)' in source
          assert 'await db.configurations.create_index("share_token", unique=True, sparse=True)' in source
          PY

      - name: Restore workflow and remove one-off helper
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/production-gate.yml
          rm -f .github/workflows/one-off-canonical-configurator-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py .github/workflows/production-gate.yml .github/workflows/one-off-canonical-configurator-integration.yml
          git commit -m 'feat: mount configurator on canonical server app'
          git push origin HEAD:phase-2/clean-production-integration

      - name: Dispatch verification workflows on patched branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run backend-tests.yml --ref phase-2/clean-production-integration
          gh workflow run production-gate.yml --ref phase-2/clean-production-integration

  backend-unit:
    needs: [canonical-integrator]
    if: ${{ always() && (needs.canonical-integrator.result == 'success' || needs.canonical-integrator.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: autoai_ci
      ADMIN_PIN: ci-admin-pin
      OTP_DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Complete backend test suite
        run: pytest -q

  frontend:
    needs: [canonical-integrator]
    if: ${{ always() && (needs.canonical-integrator.result == 'success' || needs.canonical-integrator.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      REACT_APP_BACKEND_URL: https://auto-ai-api.onrender.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

  production-smoke:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]

    steps:
      - name: Check live API health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health/live

      - name: Check API readiness
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://auto-ai-api.onrender.com/health/ready
