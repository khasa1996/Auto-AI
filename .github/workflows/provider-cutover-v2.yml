name: Provider cutover v2

on:
  push:
    branches:
      - refactor/remove-emergent

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('backend/server.py')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'^from emergentintegrations\.llm\.chat import .*$', 'from llm_provider import LlmChat, UserMessage', s, flags=re.MULTILINE)
          s = re.sub(r'^from emergentintegrations\.payments\.stripe\.checkout import .*$', 'from stripe_provider import StripeCheckout, CheckoutSessionRequest', s, flags=re.MULTILINE)
          s = re.sub(r'^EMERGENT_LLM_KEY\s*=.*$', '', s, flags=re.MULTILINE)
          s = s.replace('api_key=EMERGENT_LLM_KEY,', 'api_key=None,')
          if 'emergentintegrations' in s or 'EMERGENT_LLM_KEY' in s:
              raise SystemExit('Emergent references remain in server.py')
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          python -m py_compile backend/server.py backend/llm_provider.py backend/stripe_provider.py
          ! grep -RniE 'emergentintegrations|EMERGENT_LLM_KEY' backend --exclude-dir='__pycache__'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Provider tests
        working-directory: backend
        run: python -m pytest tests/unit/test_provider_adapters.py -q
      - name: Commit migration
        run: |
          git config user.name 'Auto-AI Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/complete-provider-cutover.yml .github/workflows/provider-cutover-v2.yml
          git add backend/server.py .github/workflows/
          git commit -m 'refactor: complete Emergent provider cutover'
          git push
