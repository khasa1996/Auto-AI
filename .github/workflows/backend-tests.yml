name: Backend Tests

on:
  push:
    branches: [main, 'codex/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Integration tests target the deployed API. Keep the base URL configurable
  # through a repository variable, with the current Render service as fallback.
  REACT_APP_BACKEND_URL: ${{ vars.AUTO_AI_API_URL || 'https://auto-ai-api.onrender.com' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend Python modules
        run: python -m compileall -q .

      - name: Run full backend test suite
        run: pytest -q
