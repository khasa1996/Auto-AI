name: Auto-AI recovery validation

on:
  push:
    branches:
      - refactor/remove-emergent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan active project for Emergent references
        run: |
          if git grep -niE 'emergentintegrations|EMERGENT_LLM_KEY|@emergentbase|assets\.emergent\.sh|\.emergent|emergentagent\.com' -- . ':(exclude).github/*' ':(exclude)memory/*' ':(exclude)test_reports/*'; then
            echo 'Active Emergent references found.'
            exit 1
          fi

      - name: Verify default AI model is not a retired/legacy identifier
        run: |
          ! grep -Rni 'claude-sonnet-4-5-20250929' backend --exclude-dir='__pycache__'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Compile backend and tests
        run: python -m compileall -q backend

      - name: Provider adapter tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest tests/unit -q

      - name: Frontend dependency install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Verify no generated validation artifacts are required
        run: test ! -e frontend/package-lock.json || rm -f frontend/package-lock.json
