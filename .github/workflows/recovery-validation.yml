name: Auto-AI recovery validation

on:
  push:
    branches:
      - refactor/remove-emergent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Scan active project for retired external integration references
        run: |
          if git grep -niE 'emergentintegrations|EMERGENT_LLM_KEY|@emergentbase|assets\.emergent\.sh|\.emergent|emergentagent\.com' -- . ':(exclude).github/workflows/recovery-validation.yml' ':(exclude)test_reports/*'; then
            echo 'Retired external integration references found in the active project.'
            exit 1
          fi

      - name: Verify default AI model is not a retired/legacy identifier
        run: |
          ! grep -Rni 'claude-sonnet-4-5-20250929' backend --exclude-dir='__pycache__'

      - name: Verify MongoDB driver compatibility
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -c "import motor, pymongo; from motor.motor_asyncio import AsyncIOMotorClient; print(f'Motor {motor.version}; PyMongo {pymongo.version}; AsyncIOMotorClient import OK')"

      - name: Compile backend and tests
        run: python -m compileall -q backend

      - name: Provider adapter tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest tests/unit -q

      - name: Frontend dependency install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Verify no generated validation artifacts are required
        run: test ! -e frontend/package-lock.json || rm -f frontend/package-lock.json
