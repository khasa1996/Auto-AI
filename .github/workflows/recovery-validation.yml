name: Auto-AI recovery validation

on:
  push:
    branches:
      - refactor/remove-emergent

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for active Emergent references
        run: |
          if git grep -niE 'emergentintegrations|EMERGENT_LLM_KEY|@emergentbase|assets\.emergent\.sh|\.emergent|emergentagent\.com' -- . ':(exclude).github/*' ':(exclude)memory/*' ':(exclude)test_reports/*'; then
            echo 'Active Emergent references found.'
            exit 1
          fi

      - name: Backend syntax and provider tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest httpx
          python -m py_compile backend/server.py backend/llm_provider.py backend/stripe_provider.py
          PYTHONPATH=backend python -m pytest backend/tests/unit/test_provider_adapters.py -q

      - name: Frontend dependency install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Clean temporary validation files
        run: rm -f frontend/package-lock.json .github/workflows/recovery-validation.yml

      - name: Record validated cutover
        run: |
          git config user.name 'Auto-AI Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --allow-empty -m 'test: validate Emergent-independent build'
          git push
